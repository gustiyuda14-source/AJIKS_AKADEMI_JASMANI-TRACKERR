version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jasmani-tracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jasmani_tracker}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-admin}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jasmani-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jasmani-tracker-api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-jasmani_tracker}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production_min_32_chars}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/dist:/app/dist
    networks:
      - jasmani-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jasmani-tracker-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - jasmani-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  jasmani-network:
    driver: bridge
